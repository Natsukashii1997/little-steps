<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>V6 拙趣手写 · 随手记</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Long+Cang&amp;family=Noto+Sans+SC:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.scr{position:relative;width:390px;height:844px;overflow:hidden;background:#FCFBF8;color:#1D1B19;font-family:"Noto Sans SC",sans-serif}
.paper{position:absolute;inset:0;pointer-events:none}
.ink path,.ink circle{fill:none;stroke:#1D1B19;stroke-linecap:round;stroke-linejoin:round}
.wb{filter:url(#wb);overflow:visible}
.under{position:absolute;inset:0}
.dim{position:absolute;inset:0;background:rgba(29,27,25,.32)}
.sheet{position:absolute;left:0;right:0;top:128px;bottom:0;background:#FCFBF8;border-radius:28px 26px 0 0;padding:10px 24px 0}
.grab{display:block;margin:0 auto 6px}
.hd{display:flex;align-items:flex-end;justify-content:space-between}
.hd .ttl{display:flex;align-items:flex-end}
.cancel{font-size:13px;color:#6B655E;text-decoration:none;padding:12px 4px}
.tip{margin:4px 0 14px;font-size:12px;color:#6B655E}
.types{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin-bottom:12px}
.ty{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:transparent;padding:4px 0;min-height:72px;font-family:"Long Cang",cursive;font-size:17px;color:#6B655E;cursor:pointer}
.ty.on{color:#1D1B19}
.ty b{position:relative;font-weight:400;isolation:isolate}
.ty b svg{position:absolute;left:-6px;width:calc(100% + 12px);bottom:2px;z-index:-1}
.q{display:flex;align-items:center;gap:6px;margin-bottom:6px}
.q span{font-family:"Long Cang",cursive;font-size:19px;margin-right:6px}
.ch{position:relative;border:0;background:transparent;min-height:40px;padding:0 6px;font:500 13px "Noto Sans SC",sans-serif;color:#6B655E;cursor:pointer}
.ch.on{color:#1D1B19}
.ch svg{position:absolute;left:0;right:0;bottom:8px;z-index:0}
.ch i{position:relative;z-index:1;font-style:normal}
.write{display:block;width:100%;box-sizing:border-box;min-height:84px;border:0;background:transparent;resize:none;font-family:"Long Cang",cursive;font-size:22px;line-height:1.6;color:#1D1B19;padding:2px 0;outline:none}
.line{display:block;margin-top:-4px}
.att{display:flex;align-items:center;gap:12px;margin-top:14px}
.att .ph{width:56px;height:56px;border-radius:3px;background:#ECE7DF;display:block}
.att a{font-size:13px;color:#1D1B19;text-decoration:none;padding:12px 0}
.when{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:13px;color:#6B655E}
.when a{color:#1D1B19;text-decoration:none;padding:10px 0}
.save{display:flex;align-items:center;justify-content:space-between;margin-top:18px}
.save small{font-size:12px;color:#6B655E}
.go{position:relative;border:0;background:transparent;padding:10px 12px;font-family:"Long Cang",cursive;font-size:30px;color:#1D1B19;cursor:pointer}
.go svg{position:absolute;left:0;bottom:12px;z-index:0}
.go span{position:relative;z-index:1}
</style>
</helmet>
<div class="scr" style="width:390px;height:844px">
<svg class="paper" width="390" height="844" aria-hidden="true"><defs><filter id="wb"><feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="17"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter><filter id="pp"><feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.39  0 0 0 0 0.35  0 0 0 0.07 0"/></filter></defs><rect width="390" height="844" filter="url(#pp)"/></svg>

<div class="under" aria-hidden="true">
<div style="position:absolute;left:26px;top:58px;font-size:12px;color:#6B655E">10月23日 · 周五</div>
<svg class="ink wb" width="92" height="92" viewBox="0 0 100 100" style="position:absolute;right:22px;top:40px;transform:rotate(-3deg)"><path d="M51 6 Q53 50 51 86 Q49 95 39 88" stroke-width="12"/><path d="M30 37 Q24 54 14 66" stroke-width="9"/><path d="M71 36 Q79 50 88 63" stroke-width="10"/></svg>
<div style="position:absolute;left:28px;top:96px;font-family:'Long Cang',cursive;font-size:26px">3 个月 2 天</div>
</div>
<div class="dim" aria-hidden="true"></div>

<section class="sheet" role="dialog" aria-label="记一笔">
<svg class="grab ink" width="44" height="8" viewBox="0 0 44 8" aria-hidden="true"><path d="M3 4 Q22 2 41 5" stroke-width="3" style="stroke:#B9B2A8"/></svg>
<div class="hd">
<div class="ttl" role="img" aria-label="记一笔">
<svg class="ink wb" width="50" height="50" viewBox="0 0 100 100" style="transform:rotate(-4deg)" aria-hidden="true"><path d="M14 14 L22 24" stroke-width="10"/><path d="M8 42 L22 42 Q22 64 20 82 L32 72" stroke-width="9"/><path d="M42 22 L82 21 L80 50" stroke-width="10"/><path d="M44 50 L80 50" stroke-width="9"/><path d="M44 50 Q44 74 46 84 Q50 92 70 91 Q88 90 92 82 L92 74" stroke-width="10"/></svg>
<svg class="ink wb" width="38" height="38" viewBox="0 0 100 100" style="transform:rotate(2deg) translateY(-8px)" aria-hidden="true"><path d="M8 52 Q50 46 92 50" stroke-width="14"/></svg>
<svg class="ink wb" width="54" height="54" viewBox="0 0 100 100" style="transform:rotate(3deg) translateY(2px)" aria-hidden="true"><path d="M28 6 Q22 16 12 24" stroke-width="8"/><path d="M24 12 L44 12" stroke-width="7"/><path d="M30 16 L34 26" stroke-width="7"/><path d="M68 6 Q62 16 54 24" stroke-width="8"/><path d="M64 12 L90 12" stroke-width="7"/><path d="M70 16 L74 26" stroke-width="7"/><path d="M74 34 Q50 42 24 44" stroke-width="8"/><path d="M22 56 L80 54" stroke-width="8"/><path d="M16 70 L86 68" stroke-width="9"/><path d="M50 40 Q50 80 54 88 Q60 96 80 94 Q92 92 92 82" stroke-width="11"/></svg>
</div>
<a class="cancel" href="V6-Home.dc.html">取消</a>
</div>
<p class="tip">随手记下来，月底会自动整理进回顾。</p>

<div class="types" role="group" aria-label="记什么">
<button class="ty on" type="button" aria-pressed="true"><svg class="ink wb" width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><path d="M4 20 Q20 7 36 20 Q20 33 4 20 Z" style="fill:#FCFBF8" stroke-width="1.8"/><circle cx="20" cy="20" r="5" style="fill:#A8C3DE" stroke-width="1.5"/></svg><b><svg width="100%" height="8" viewBox="0 0 40 8" preserveAspectRatio="none" aria-hidden="true"><path d="M2 4 Q14 2 26 4 T38 3" fill="none" stroke="#C2D58A" stroke-width="7" stroke-linecap="round"/></svg>观察</b></button>
<button class="ty" type="button" aria-pressed="false"><svg class="ink wb" width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><path d="M7 29 L29 7 L34 12 L12 34 Z" style="fill:#FCFBF8" stroke-width="1.8"/><path d="M13 23 L16 26 M17 19 L20 22 M21 15 L24 18" stroke-width="1.5"/></svg><b>测量</b></button>
<button class="ty" type="button" aria-pressed="false"><svg class="ink wb" width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 14 L13 14 L16 9 L24 9 L27 14 L34 14 L34 31 L6 31 Z" style="fill:#FCFBF8" stroke-width="1.8"/><circle cx="20" cy="22" r="5" style="fill:#A8C3DE" stroke-width="1.5"/></svg><b>照片</b></button>
<button class="ty" type="button" aria-pressed="false"><svg class="ink wb" width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><path d="M15 15 L25 15 L27 34 Q20 37 13 34 Z" style="fill:#FCFBF8" stroke-width="1.8"/><path d="M17 15 Q20 6 23 15" stroke-width="1.8"/><path d="M15 22 L19 22 M15 27 L19 27" stroke-width="1.4"/></svg><b>照护</b></button>
<button class="ty" type="button" aria-pressed="false"><svg class="ink wb" width="36" height="36" viewBox="0 0 40 40" aria-hidden="true"><path d="M6 10 Q20 4 34 10 Q38 20 30 26 L22 27 L15 34 L16 27 Q6 25 6 17 Z" style="fill:#FCFBF8" stroke-width="1.8"/><path d="M17 13 Q20 10 23 13 Q24 16 20 18 L20 20" stroke-width="1.6"/><path d="M20 23.5 L20 23.6" stroke-width="2.4"/></svg><b>问医生</b></button>
</div>

<div class="q"><span>看到了吗</span>
<button class="ch on" type="button" aria-pressed="true"><svg width="100%" height="9" viewBox="0 0 60 9" preserveAspectRatio="none" aria-hidden="true"><path d="M3 5 Q20 2 38 4 T57 4" fill="none" stroke="#A8C3DE" stroke-width="7" stroke-linecap="round"/></svg><i>看到了</i></button>
<button class="ch" type="button" aria-pressed="false"><i>留意了，还没看到</i></button>
</div>

<label for="q" style="position:absolute;left:-9999px">写下看到的</label>
<textarea id="q" class="write">抓着我的手指不放，好久都不松开。</textarea>
<svg class="line ink wb" width="342" height="8" viewBox="0 0 342 8" aria-hidden="true"><path d="M2 4 Q90 2 172 5 T340 3" stroke-width="1.4"/></svg>

<div class="att"><span class="ph" role="img" aria-label="已附的照片"></span><a href="#media">+ 照片或视频</a></div>
<div class="when">今天 10月23日 14:20<a href="#time">改时间</a></div>

<div class="save"><small>会出现在本月和成长里</small>
<button class="go" type="button"><svg width="76" height="14" viewBox="0 0 76 14" preserveAspectRatio="none" aria-hidden="true"><path d="M4 8 Q24 3 46 7 T72 6" fill="none" stroke="#C2D58A" stroke-width="12" stroke-linecap="round"/></svg><span>记下</span></button>
</div>
</section>
</div>
</x-dc>

</body>
</html>
